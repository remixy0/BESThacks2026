spring.application.name=rest-service

# Local HTTP development; enable Secure cookies when deploying behind HTTPS.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m

# Set these environment variables in the IntelliJ run configuration.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Initialize the users table before Hibernate validates the schema.
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate

# PostgreSQL is managed separately; compose.yaml currently has no services.
spring.docker.compose.enabled=false
server.port=8081
